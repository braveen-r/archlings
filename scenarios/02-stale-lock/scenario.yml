id: stale-lock
title: Remove the stale pacman lock
difficulty: beginner
description: >
  Your package manager thinks another instance of pacman is running.
  Diagnose the issue, ensure no other pacman processes are active, and remove the lock safely.
hints:
  - Read the error message carefully; it tells you exactly which file is blocking pacman.
  - The lock file is usually located in /var/lib/pacman/.
  - You can use the 'rm' command to delete the file once you are sure it's stale.
