[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "archlings"
version = "0.1.0"
description = "A rustlings-style Arch Linux troubleshooting trainer"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "duckdb>=0.9.0",
    "pyyaml>=6.0"
]

[project.scripts]
archlings = "archlings.cli.main:app"

[tool.setuptools.packages.find]
include = ["archlings", "archlings.*"]
